<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — SpeakPower</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#17140f">
<link rel="icon" href="/SpeakPower-/assets/favicon.svg" type="image/svg+xml">

<!--
  Styles are inlined rather than linked. GitHub Pages serves this file for any
  unmatched path at any depth, so a relative stylesheet href would 404 on
  /a/b/c while resolving fine on /a. Self-contained is the only reliable option.
  Absolute links below carry the /SpeakPower-/ project-page prefix; drop that
  prefix if the site moves to a custom domain at the root.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: #fbf8f2;
    color: #17140f;
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.68;
    text-align: center;
  }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .75rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #8f3f14;
    margin: 0 0 1.25rem;
  }
  h1 {
    font-family: "Fraunces", "Iowan Old Style", Palatino, Georgia,
                 "Times New Roman", serif;
    font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem);
    font-weight: 600;
    letter-spacing: -.028em;
    line-height: 1.12;
    margin: 0 0 1rem;
    text-wrap: balance;
  }
  p { max-width: 46ch; margin: 0 auto 2rem; color: #5d5447; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a.btn {
    display: inline-block;
    padding: .9rem 1.6rem;
    border: 1px solid transparent;
    border-radius: 6px;
    font-weight: 600;
    font-size: .95rem;
    text-decoration: none;
    transition: background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  a.primary { background: #b4531f; border-color: #b4531f; color: #fff; }
  a.primary:hover { background: #8f3f14; border-color: #8f3f14; }
  a.ghost { border-color: #cfc5b0; color: #17140f; }
  a.ghost:hover { border-color: #b4531f; color: #8f3f14; }
  a.btn:focus-visible { outline: 2px solid #1f5c92; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>That page isn't here.</h1>
    <p>
      The link is broken, or the page has moved. Everything SpeakPower does is
      two clicks away from the homepage.
    </p>
    <div class="actions">
      <a class="btn primary" href="/SpeakPower-/">Back to the homepage</a>
      <a class="btn ghost" href="/SpeakPower-/contact.html">Book a call</a>
    </div>
  </main>
</body>
</html>
