<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpeakPower — Open Graph card source (1200×630)</title>
<!--
  SOURCE FOR assets/og-image.png

  This is the social-share card. To regenerate it without any local tooling:
    1. Open this file in a browser (GitHub Pages serves it at /tools/og-image.html).
    2. Set the window to exactly 1200 × 630, or screenshot the .card element.
    3. Save the result as assets/og-image.png.

  Keep the headline here in sync with the homepage h1 — this card is what
  people see before they ever reach the site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    padding: 58px 78px;
    background: #17140f;
    color: #f7f3ea;
    font-family: "Work Sans", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
  }

  /* Warm light from the upper right, echoing the site hero. */
  .glow {
    position: absolute; z-index: 0;
    top: -240px; right: -150px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(217,164,65,.26), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(247,243,234,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(247,243,234,.045) 1px, transparent 1px);
    background-size: 66px 66px;
    -webkit-mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
            mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
  }
  .row { position: relative; z-index: 1; }

  /* --- Brand bar --- */
  .brandbar {
    display: flex; align-items: center; gap: 17px;
    margin-bottom: 50px;
  }
  .mark { display: flex; align-items: flex-end; gap: 5px; height: 38px; }
  .mark i { display: block; width: 8px; border-radius: 2px; }
  .b1 { height: 15px; background: #5d5447; }
  .b2 { height: 23px; background: #8a7c66; }
  .b3 { height: 31px; background: #b4531f; }
  .b4 { height: 38px; background: #d9a441; }
  .wordmark {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 30px; font-weight: 600; letter-spacing: -.6px;
  }
  .wordmark span { color: #d9a441; }

  /* --- Headline --- */
  h1 {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 64px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -2.2px;
    max-width: 19ch;
  }
  h1 em { font-style: normal; color: #d9a441; }

  .sub {
    margin-top: 22px;
    font-size: 24px;
    line-height: 1.45;
    color: #b2a894;
    max-width: 46ch;
  }

  /* --- Footer strip --- */
  .foot {
    display: flex; align-items: center; gap: 30px;
    margin-top: 42px;
    padding-top: 25px;
    border-top: 1px solid #3a332a;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    letter-spacing: .4px;
    color: #b2a894;
  }
  .foot b { display: flex; align-items: center; gap: 10px; font-weight: 400; }
  .foot b::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #1e5c49;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="row brandbar">
    <span class="mark"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></span>
    <span class="wordmark">Speak<span>Power</span></span>
  </div>

  <div class="row">
    <h1>Your message already has power. <em>We help it land.</em></h1>
    <p class="sub">
      Strategy, communication audits and public speaking — and the systems your strategy runs on.
    </p>
  </div>

  <div class="row foot">
    <b>Kampala, Uganda</b>
    <b>Strategy &amp; narrative</b>
    <b>Systems &amp; software</b>
  </div>
</body>
</html>
