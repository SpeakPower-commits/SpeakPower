<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpeakPower — Open Graph card source (1200×630)</title>
<!--
  SOURCE FOR assets/og-image.png

  This is the social-share card — the thumbnail that appears when the site is
  linked on LinkedIn, WhatsApp, X, Slack or in a Google result. To regenerate
  it without any local tooling:

    1. Open this file in a browser (GitHub Pages serves it at /tools/og-image.html).
    2. Set the window to exactly 1200 × 630, or screenshot the page.
    3. Save the result as assets/og-image.png.

  Three things to keep true:

    - The headline must match the homepage h1. This card is what people see
      before they ever reach the site, and a card that promises a different
      sentence than the page delivers is the exact failure the site sells
      against.
    - 1200 × 630 exactly. Every platform crops to roughly that ratio; anything
      else gets cut, usually through the headline.
    - Nothing important within ~60px of any edge. LinkedIn and WhatsApp crop
      more aggressively than the spec suggests, and the venture strip below is
      the first thing to lose.

  The mark and both venture logos are the real files from assets/, not
  approximations — so this card cannot drift out of sync with the brand.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 52px 74px 46px;
    background: #16233f;
    color: #f2f4f8;
    font-family: "Work Sans", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
  }

  /* Gold light from the upper right, echoing the rays in the logo. */
  .glow {
    position: absolute; z-index: 0;
    top: -250px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(201,162,39,.30), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(242,244,248,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(242,244,248,.05) 1px, transparent 1px);
    background-size: 66px 66px;
    -webkit-mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
            mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
  }
  .row { position: relative; z-index: 1; }

  /* --- Brand bar --- */
  .brandbar {
    display: flex; align-items: center; gap: 15px;
    margin-bottom: 38px;
  }
  .mark { width: 50px; height: 50px; flex: none; display: block; }
  .wordmark {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 31px; font-weight: 600; letter-spacing: -.6px;
  }
  .wordmark span { color: #e0be4f; }
  .tagline {
    margin-left: 3px;
    padding-left: 17px;
    border-left: 1px solid #2c3c5c;
    font-family: "Fraunces", "DejaVu Serif", Georgia, serif;
    font-style: italic;
    font-size: 20px;
    color: #e0be4f;
  }

  /* --- Headline --- */
  /* Two lines, not three. 630px is a hard ceiling and the venture strip is
     anchored to the bottom of it, so a third headline line pushes the strip
     off the card entirely. */
  h1 {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 58px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -2px;
    max-width: 22ch;
  }
  h1 em { font-style: normal; color: #e0be4f; }

  .sub {
    margin-top: 20px;
    font-size: 23px;
    line-height: 1.45;
    color: #9aa8c0;
    max-width: 48ch;
  }

  /* --- Venture strip ------------------------------------------------------
     The differentiator, and the reason this card is not interchangeable with
     any other consultant's: two marketing products, owned and running. Each
     logo sits on a tile painted its own ground colour, exactly as on the site,
     so the artwork keeps its own world against the navy. */
  .foot {
    display: flex; align-items: center; gap: 26px;
    margin-top: auto;
    padding-top: 26px;
    border-top: 1px solid #2c3c5c;
  }
  .owns {
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #c9a227;
    max-width: 10ch;
    line-height: 1.5;
  }
  .vent { display: flex; align-items: center; gap: 13px; }
  .vent img {
    width: 54px; height: 54px; flex: none;
    padding: 4px; border-radius: 12px; object-fit: contain;
    background: var(--tile, #fff);
  }
  .vent b  { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .vent i  {
    display: block; font-style: normal; font-size: 14px; color: #9aa8c0;
    letter-spacing: .2px;
  }
  .place {
    margin-left: auto;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 16px;
    letter-spacing: .4px;
    color: #9aa8c0;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="row brandbar">
    <img class="mark" src="../assets/logo-mark.png" alt="" width="160" height="160">
    <span class="wordmark">Speak<span>Power</span></span>
    <span class="tagline">Articulate is key</span>
  </div>

  <div class="row">
    <h1>Your message already has power. <em>I help it land.</em></h1>
    <p class="sub">
      Communication strategy, audits and public speaking &mdash; and the systems
      your strategy runs on.
    </p>
  </div>

  <div class="row foot">
    <span class="owns">I own and run</span>

    <span class="vent">
      <img src="../assets/tonninyira-logo.webp" style="--tile:#ffffff" alt="" width="320" height="320">
      <span><b>Tonninyira</b><i>Online marketing app</i></span>
    </span>

    <span class="vent">
      <img src="../assets/cuepointe-logo.webp" style="--tile:#ffffcb" alt="" width="320" height="320">
      <span><b>CuePointe</b><i>Cuesports marketing</i></span>
    </span>

    <span class="place">Kampala, Uganda</span>
  </div>
</body>
</html>
