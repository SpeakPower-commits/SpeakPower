<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpeakPower — Open Graph card source (1200×630)</title>
<!--
  SOURCE FOR assets/og-image.png

  This is the social-share card. To regenerate it without any local tooling:
    1. Open this file in a browser (GitHub Pages serves it at /tools/og-image.html).
    2. Set the window to exactly 1200 × 630, or screenshot the .card element.
    3. Save the result as assets/og-image.png.

  Keep the headline here in sync with the homepage h1 — this card is what
  people see before they ever reach the site.

  Colours are the brand navy and gold taken from the SpeakPower logo. If you
  have the logo as a transparent PNG, you can replace the inline mark below
  with <img src="../assets/logo.png"> instead.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    padding: 56px 78px;
    background: #16233f;
    color: #f2f4f8;
    font-family: "Work Sans", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
  }

  /* Gold light from the upper right, echoing the rays in the logo. */
  .glow {
    position: absolute; z-index: 0;
    top: -250px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(201,162,39,.30), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(242,244,248,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(242,244,248,.05) 1px, transparent 1px);
    background-size: 66px 66px;
    -webkit-mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
            mask-image: radial-gradient(118% 95% at 82% 0%, #000 8%, transparent 70%);
  }
  .row { position: relative; z-index: 1; }

  /* --- Brand bar --- */
  .brandbar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 44px;
  }
  .mark { width: 46px; height: 46px; flex: none; }
  .wordmark {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 31px; font-weight: 600; letter-spacing: -.6px;
  }
  .wordmark span { color: #e0be4f; }
  .tagline {
    margin-left: 4px;
    padding-left: 18px;
    border-left: 1px solid #2c3c5c;
    font-family: "Fraunces", "DejaVu Serif", Georgia, serif;
    font-style: italic;
    font-size: 20px;
    color: #e0be4f;
  }

  /* --- Headline --- */
  h1 {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 63px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -2.1px;
    max-width: 19ch;
  }
  h1 em { font-style: normal; color: #e0be4f; }

  .sub {
    margin-top: 22px;
    font-size: 24px;
    line-height: 1.45;
    color: #9aa8c0;
    max-width: 46ch;
  }

  /* --- Footer strip --- */
  .foot {
    display: flex; align-items: center; gap: 30px;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid #2c3c5c;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    letter-spacing: .4px;
    color: #9aa8c0;
  }
  .foot b { display: flex; align-items: center; gap: 10px; font-weight: 400; }
  .foot b::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #c9a227;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="row brandbar">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="#c9a227"
            d="M16 13h32a7 7 0 0 1 7 7v19a7 7 0 0 1-7 7H31l-11 9v-9h-4a7 7 0 0 1-7-7V20a7 7 0 0 1 7-7z"/>
      <path fill="#16233f"
            d="M24.5 41.5c0-4-2.2-5.6-2.2-10.2 0-6.2 4.6-11 10.6-11 5.8 0 9.9 4 9.9 9 0 2.4 1.9 3.6 1.2 4.7-.5.8-1.6.9-2.9.9-.1 3.4-1.2 5.2-3.8 5.2-.9 0-1.6-.1-2.2-.3v1.7z"/>
    </svg>
    <span class="wordmark">Speak<span>Power</span></span>
    <span class="tagline">Articulate is key</span>
  </div>

  <div class="row">
    <h1>Your message already has power. <em>We help it land.</em></h1>
    <p class="sub">
      Strategy, communication audits and public speaking — and the systems your strategy runs on.
    </p>
  </div>

  <div class="row foot">
    <b>Kampala, Uganda</b>
    <b>Strategy &amp; narrative</b>
    <b>Systems &amp; software</b>
  </div>
</body>
</html>
