<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpeakPower — LinkedIn post graphic source (1200×627)</title>
<!--
  SOURCE FOR assets/speakpower-linkedin-card.png

  A post graphic for LinkedIn. To regenerate:
    1. Open in a browser, window taller than 627px.
    2. Screenshot, crop to 1200 × 627 from the top.

  To reuse it for a different post, change the .line text and nothing else.
  Keep it to one sentence: a feed gives you about a second, and two sentences
  at this size are two sentences nobody reads.

  The portrait sits inside a WHITE circle on purpose. assets/otieno-thomas.jpg
  is a background-removed portrait on white rather than on transparency, so a
  white circle is seamless where a navy one would show a hard rectangle.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; }
  body {
    position: relative;
    display: flex;
    align-items: center;
    gap: 54px;
    overflow: hidden;
    padding: 54px 64px;
    background: #16233f;
    color: #f2f4f8;
    font-family: "Work Sans", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
  }

  .glow {
    position: absolute; z-index: 0;
    top: -220px; right: -180px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(201,162,39,.32), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(242,244,248,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(242,244,248,.05) 1px, transparent 1px);
    background-size: 62px 62px;
    -webkit-mask-image: radial-gradient(118% 95% at 85% 5%, #000 6%, transparent 68%);
            mask-image: radial-gradient(118% 95% at 85% 5%, #000 6%, transparent 68%);
  }

  .copy { position: relative; z-index: 1; flex: 1 1 auto; min-width: 0; }

  .brandbar { display: flex; align-items: center; gap: 13px; margin-bottom: 30px; }
  .mark { width: 42px; height: 42px; flex: none; display: block; }
  .wordmark {
    font-family: "Fraunces", "DejaVu Serif", Georgia, serif;
    font-size: 26px; font-weight: 600; letter-spacing: -.5px;
  }
  .wordmark span { color: #e0be4f; }

  .line {
    font-family: "Fraunces", "DejaVu Serif", Georgia, "Times New Roman", serif;
    font-size: 50px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -1.6px;
    max-width: 17ch;
  }
  .line em { font-style: normal; color: #e0be4f; }

  .who {
    display: flex; align-items: center; gap: 14px;
    margin-top: 34px;
    padding-top: 22px;
    border-top: 1px solid #2c3c5c;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 16px;
    letter-spacing: .4px;
    color: #9aa8c0;
  }
  .who b { color: #f2f4f8; font-weight: 400; }

  /* White fill, because the portrait's own ground is white. */
  .face {
    position: relative; z-index: 1;
    flex: none;
    width: 380px; height: 380px;
    overflow: hidden;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(201,162,39,.85),
                0 26px 60px -22px rgba(0,0,0,.75);
  }
  /* Same crop numbers as tools/avatar.html. The source is one portrait, so one
     crop should read correctly in both; two sets of values drift apart the
     first time the photo is replaced. */
  .face img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 16%;
    transform: scale(1.14);
    transform-origin: 50% 30%;
    display: block;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="copy">
    <div class="brandbar">
      <img class="mark" src="../assets/logo-mark.png" alt="" width="160" height="160">
      <span class="wordmark">Speak<span>Power</span></span>
    </div>

    <p class="line">Your message already has power. <em>I help it land.</em></p>

    <div class="who">
      <b>Otieno Thomas</b> &middot; Communication strategy &middot; Kampala
    </div>
  </div>

  <div class="face">
    <img src="../assets/otieno-thomas.jpg" alt="Otieno Thomas" width="1080" height="1350">
  </div>
</body>
</html>
